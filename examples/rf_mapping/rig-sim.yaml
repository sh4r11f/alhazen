# Headless: simulated display, simulated spike source, no dashboard.
# What tests and CI run, and the quickest way to see a complete RF-mapping
# run directory (events, probe logs, rf_live_maps.npz) with nothing
# installed. The simulated channels carry ground-truth receptive fields, so
# the saved map is checkable, not just present.
monitor:
  width_px: 1920
  height_px: 1080
  width_cm: 60.0
  distance_cm: 60.0
  refresh_rate_hz: 60.0
  fullscreen: false
display:
  backend: simulated
devices:
  reward:
    backend: simulated
  sync:
    backend: simulated
    event_lines:
      TRIAL_START: Dev1/port0/line0
      PROBE_ON: Dev1/port0/line1
  spikes:
    backend: simulated
    sim_channels: 6
    # Ground truth inside the example task's lower-left grid (centred on
    # -5, -4), so the recovered maps peak where these say.
    sim_rf_centers_dva:
      - [-7.0, -6.0]
      - [-3.0, -2.0]
      - [-5.0, -4.0]
      - [-8.0, -1.0]
      - [-2.0, -7.0]
      - [-4.5, -5.5]
    sim_rf_sigma_dva: 1.5
    sim_baseline_hz: 3.0
    sim_peak_hz: 120.0
data_root: data
