# The live-map demonstration: rig-sim plus the browser dashboard. Run
#
#     python run.py --mode simulate --rig rig-demo.yaml
#
# and the dashboard's "RF map" section shows the receptive-field heat maps
# being recovered, trial by trial, from the simulated channels' ground-truth
# fields — the same page, the same panels and the same pipeline a real rig
# shows during a recording, with no hardware anywhere.
monitor:
  width_px: 1920
  height_px: 1080
  width_cm: 60.0
  distance_cm: 60.0
  refresh_rate_hz: 60.0
  fullscreen: false
display:
  backend: simulated
dashboard:
  enabled: true
  auto_open: true
devices:
  reward:
    backend: simulated
  sync:
    backend: simulated
    event_lines:
      TRIAL_START: Dev1/port0/line0
      PROBE_ON: Dev1/port0/line1
  spikes:
    backend: simulated
    sim_channels: 6
    sim_rf_centers_dva:
      - [-7.0, -6.0]
      - [-3.0, -2.0]
      - [-5.0, -4.0]
      - [-8.0, -1.0]
      - [-2.0, -7.0]
      - [-4.5, -5.5]
    sim_rf_sigma_dva: 1.5
    sim_baseline_hz: 3.0
    sim_peak_hz: 120.0
data_root: data/dev
