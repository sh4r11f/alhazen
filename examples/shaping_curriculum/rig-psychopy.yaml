# A visible PsychoPy window; the example supplies its own scripted subject.
monitor:
  width_px: 1280
  height_px: 720
  width_cm: 60.0
  distance_cm: 60.0
  refresh_rate_hz: 60.0
  fullscreen: false
display:
  backend: psychopy
  frame_qa:
    policy: warn
dashboard:
  enabled: true
  auto_open: true
  port: 0
devices:
  reward:
    backend: simulated
data_root: data
