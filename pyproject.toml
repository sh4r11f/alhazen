[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alhazen-vision"
version = "1.10.0"
description = "A framework for building and running vision science experiments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sharif Saleki", email = "sharif.saleki@gmail.com" }]
requires-python = ">=3.10"
# The Python versions CI runs the suite on (.github/workflows/ci.yml), and no
# others: a classifier is a claim to pip and PyPI readers, so a version joins
# this list in the same change that adds it to the CI matrix.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# The hardware-free core deliberately stays light: everything a simulated
# session needs, nothing a laptop can't install. Renderer and vendor SDKs are
# extras with lazy imports.
dependencies = [
  "numpy>=1.24",
  # Scheduler summaries (adaptive fits, per-cell counts) are tables, and a
  # table an experimenter will open in a notebook is a DataFrame.
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pydantic>=2.5",
]

[project.optional-dependencies]
# The PsychoPy display backend + stimuli. An extra (not a core dependency) so
# CI and analysis machines never pay for it; alhazen.display.psychopy_backend
# imports it lazily and raises a DisplayError naming this extra if missing.
psychopy = ["psychopy>=2024.1.0"]
# NI-DAQ reward and TTL sync, on the rig only (Windows). Neither eye tracker
# SDK has an extra, on purpose, because neither is on PyPI: pylink ships with
# SR Research's EyeLink Developer's Kit (and the PyPI project of that name is
# unrelated and must never be installed), and pypixxlib ships with VPixx's
# Software Tools installer. Both backends say so in their connect() errors.
nidaq = ["nidaqmx"]
# The movie mode's encoder. An extra rather than a core dependency because
# imageio-ffmpeg ships an ffmpeg binary, which is a lot to install on a rig
# that will never write a movie; alhazen.modes.movie imports it lazily and
# raises a ConfigError naming this extra if it is missing. Pillow is pinned
# here explicitly rather than inherited through imageio, whose floor (8.3) is
# far below the APIs the sheet's captions use (load_default(size=...), 10.1).
# imageio-ffmpeg likewise: imageio 2.31 passes write_frames(audio_path=...),
# which imageio-ffmpeg only accepts from 0.4.4 — found by CI's lowest-deps job.
movie = ["imageio>=2.31", "imageio-ffmpeg>=0.4.4", "pillow>=10.1"]
# Analysis-side extras: scipy for the fits some analyses want. The readers
# and the alignment need only numpy, so a plain install can still read a
# session and align it to a recording.
analysis = ["scipy>=1.10"]
# The sorted_stream spike backend's transport. An extra rather than a core
# dependency because only a rig running a real-time sorter needs it;
# alhazen.devices.spikes imports it lazily and raises a SpikeSourceError
# naming this extra if it is missing.
zmq = ["pyzmq>=25"]
# The documentation site. Not needed to use alhazen, only to build its docs.
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.24",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "import-linter>=2.0",
  "types-PyYAML",
  # The movie recorder needs no screen — it composites frames with numpy and
  # writes a file — so there is nothing to stop the test suite from
  # exercising the real encoder, and a writer whose only test skips itself is
  # a writer nobody is testing.
  "alhazen-vision[movie]",
  # Same argument as movie: the sorted_stream backend's socket needs no
  # sorter and no probe — a PUB socket in the test process is a complete
  # far end — so the real transport is tested rather than skipped.
  "alhazen-vision[zmq]",
  # scripts/release_check.py reads pyproject.toml. tomllib is stdlib from
  # 3.11; this is the backport for the 3.10 job.
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
alhazen = "alhazen.cli.main:main"

# The scaffold's templates and the live monitor's frontend ship inside the wheel
# — both are read at runtime, so a package that omitted them would install
# fine and fail on first use (`alhazen new`, and a blank live monitor page).
[tool.setuptools.package-data]
alhazen = ["py.typed", "_scaffold/template/**/*", "live_monitor/assets/*", "cli/assets/*"]

[project.urls]
Repository = "https://github.com/sh4r11f/alhazen"
Documentation = "https://sh4r11f.github.io/alhazen/"
Changelog = "https://github.com/sh4r11f/alhazen/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not display'"
markers = [
  "display: needs a real window (PsychoPy installed and a screen attached); run manually with -m display",
  # Slow but not optional: the scaffold acceptance test installs two packages
  # and runs two subprocess sessions. It is in the default suite, marked so it
  # can be deselected while iterating (`-m 'not slow'`).
  "slow: takes tens of seconds (subprocess installs and full sessions)",
]

# CI runs `pytest --cov=alhazen`; without a floor that measurement could fail
# nothing, and a change that deleted half the tests would still go green.
# `source` pins what is measured to the package itself (not the tests, not
# whatever else is importable), and `branch` counts an `if` whose else-side
# never ran as a miss, which line coverage alone reports as covered.
[tool.coverage.run]
source = ["alhazen"]
branch = true

# The floor sits just under the total measured when it was set — 90.99%
# (line + branch, full default suite, Windows / Python 3.12, 2026-09) — so it
# catches a real drop without failing on the noise of one refactor or on the
# few platform-specific lines another OS's job does not reach. Raise it when
# coverage rises; never lower it to make CI pass.
# Subprocess sessions (the scaffold acceptance test, the live monitor child) are
# not measured, so the true figure is somewhat higher than this reports.
[tool.coverage.report]
fail_under = 89
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

# ruff >=0.13 formats Python blocks inside markdown. The docs' snippets are
# prose-shaped and their formatting was never part of this gate's contract,
# so the *formatter* skips markdown. `ruff check` still lints
# everything, and the docs' Python snippets are compiled by a test
# (tests/unit/test_docs_snippets.py) — the check that actually matters.
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM"]
ignore = [
  "SIM108", # ternary rewrites often hurt readability in frame-loop code
  "C408",   # outcomes(CORRECT=dict(completed=True)) is the intended API idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# No `python_version` pin here. It said 3.10, which made mypy parse every stub
# it follows as 3.10 as well — and numpy's stubs now use PEP 695 `type`
# statements, so the check died inside numpy on any 3.12 runner, with a syntax
# error about a file this project does not own. The CI matrix is the
# compatibility gate that matters: mypy on the 3.10 job checks this code
# against 3.10, because that is the interpreter running it.
[tool.mypy]
files = ["src"]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "psychopy.*",
  # pyglet is PsychoPy's window and font layer; the display backend asks it
  # directly whether a face is installed. No stubs.
  "pyglet.*",
  "PIL.*",
  "pandas.*",
  "nidaqmx.*",
  "pylink.*",
  "pypixxlib.*",
  "imageio.*",
  # The SpikeGLX remote API bindings ship with the SpikeGLX-CPP-SDK, not on
  # PyPI, and carry no stubs; both import spellings the backend tries.
  "sglx_pkg.*",
  "sglx",
]
ignore_missing_imports = true

# Layering is enforced, not folklore: imports point only
# downward. Modules on the same line are independent of each other.
# alhazen.errors and alhazen.version sit outside the contract on purpose —
# anything may import them. Every package must be on a line: lint-imports
# checks nothing about a package it is not told about, and
# tests/unit/test_layering.py fails until a new one is added here (and to the
# two drawings of this list, in CONTRIBUTING.md and docs/architecture.md §1,
# which it also checks against this config).
#
# modes sits directly under cli, which is the only package that imports it,
# and above session because each mode builds or drives a session (and needs
# task, devices, paradigms, core, display and config, all further down).
# Nothing in modes may reach up into cli: the ruler measure mode draws lives in
# display/ruler.py, not in cli/calibrate.py where `calibrate ruler` first drew
# it, because importing it from there was a cli <-> modes cycle that stayed
# invisible while modes was off this list.
#
# _deprecation (the @deprecated decorator) is a single module, not a package,
# but it gets a line of its own at the very bottom rather than an exemption
# like errors and version: it imports nothing from alhazen, and the line is
# what keeps it that way — while any layer, config included, may still import
# it to deprecate one of its own names. (Sharing config's line would forbid
# exactly that: packages on one line may not import each other.)
#
# _scaffold shares the config line: the template renderer behind `alhazen new`
# imports nothing from alhazen but errors (it is stdlib string.Template over
# files), and only cli imports it. Its line keeps it that way — it may not
# import any other alhazen package (only _deprecation, the line below).
#
# devices sits with paradigms: it needs core (the clock, and Event for the
# tracker-message subscriber), display (calibration graphics draw into the
# window) and config — all below it — while nothing below ever imports it.
# Only session/builder.py wires devices, which is what keeps the engine and
# every phase hardware-free. devices and paradigms share a line because they
# are mutually independent.
#
# task sits above paradigms because Task.make_source builds schedulers, and
# below session because the session runner calls a task, never the reverse —
# which is why TrialSetup/TrialPlan live in task/plan.py.
#
# training sits between them: it re-validates parameters through the task's
# own params model (so it must be above task), and the session runner drives
# it (so it must be below session). Nothing in task knows a curriculum exists.
#
# scenes shares the stimuli line: it is a stimulus provider (SceneStimulus
# satisfies the Stimulus protocol), and it imports only display and config —
# the same things stimuli imports, and nothing that would let a scene reach a
# device or a session.
#
# analysis shares the session line: it reads what a session wrote, using the
# same core/config/data/display.screen the session used, and imports none of
# session, task, devices or stimuli — so an analysis machine needs no renderer
# and no device SDK, and an analysis can never quietly re-declare what the rig
# was doing (it reads the run's own snapshot instead).
[tool.importlinter]
root_package = "alhazen"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
# neural shares core's line: pure numpy arithmetic (spike detection, RF
# accumulation, the live timebase) that devices runs during a session and
# analysis runs again over the files — so it must sit below both, import
# nothing above config, and stay mutually independent of core.
layers = [
  "alhazen.cli",
  "alhazen.modes",
  "alhazen.session | alhazen.testing | alhazen.analysis",
  "alhazen.training",
  "alhazen.task",
  # The live monitor's pre-1.9 import path: a warning re-export, removed in
  # 2.0. Its own line above live_monitor because it imports it.
  "alhazen.dashboard",
  "alhazen.live_monitor",
  "alhazen.paradigms | alhazen.devices",
  "alhazen.core | alhazen.neural",
  "alhazen.stimuli | alhazen.scenes",
  "alhazen.display",
  "alhazen.config | alhazen.data | alhazen._scaffold",
  "alhazen._deprecation",
]
