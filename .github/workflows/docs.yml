# Build the docs site and publish it to GitHub Pages. `--strict` so a broken
# link or a reference to a moved page fails the build rather than shipping a
# site with a dead link in it.
name: docs

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, per job. The workflow default is read-only; only deploy
# is granted the two permissions that can publish the site. build must not
# hold them: it pip-installs and runs the pull request's own code, and a
# pull request should not be able to reach a token that writes to Pages.
permissions:
  contents: read

# Every `uses:` is pinned to a full commit SHA, the tag it was resolved from
# in the trailing comment: a tag can be moved to other code, a SHA cannot.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/

  deploy:
    # Only main publishes; a pull request just proves the site still builds.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # The only job that publishes, so the only one with the permissions to:
    # pages to write the site, id-token for the OIDC token deploy-pages
    # proves its identity with. Setting permissions on a job replaces the
    # workflow's, so contents: read is repeated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
