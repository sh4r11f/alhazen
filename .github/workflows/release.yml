# Build and publish on a version tag. TestPyPI first, always: a release that
# cannot be installed is discovered by installing it, and doing that on the
# real index means living with the version number forever.
name: release

on:
  push:
    tags: ["v*"]
  # No inputs: what gets published is decided by the ref, not by a form. A
  # manual run always goes to TestPyPI and stops there; the `pypi` job is
  # gated on `refs/tags/v*` below. An input nothing read was worse than none —
  # choosing "pypi" in the dialog silently did nothing.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Fails on a malformed description or metadata, which PyPI would
          # otherwise reject after the version number is already spent.
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # trusted publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-test:
    # Install what was just published, on every OS the project supports, and
    # import it. A wheel that builds but does not install is the failure this
    # catches.
    needs: testpypi
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from TestPyPI and import
        run: |
          python -m pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ alhazen
          python -c "import alhazen; print(alhazen.__version__)"
          alhazen --version

  pypi:
    # Only on a tag, and only after the smoke test passed.
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
