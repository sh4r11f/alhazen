# Check and build on a version tag.
#
# Publishing is not set up yet. The jobs that uploaded to TestPyPI, installed
# the result on every operating system, and then uploaded to PyPI failed on
# every release, because no trusted publisher is registered for this
# repository on either index. A run that always fails reads as a broken
# release, and it hides a real failure among the expected ones, so those jobs
# were removed until alhazen is published. docs/versioning.md says how to
# bring them back; the jobs themselves are in the git history of this file.
#
# What stays is everything that can fail for a reason worth hearing: the
# version gate, and a build of the wheel and sdist that twine checks.
name: release

on:
  push:
    tags: ["v*"]
  # A manual run checks and builds whatever ref it is started on.
  workflow_dispatch:

jobs:
  check:
    # The gate, and it runs before anything is built. The tag, the version in
    # pyproject.toml and the newest CHANGELOG section must name the same
    # release. A mismatch caught here costs one re-tag; the same mismatch
    # caught after publishing costs that version number forever, because PyPI
    # never lets a number be reused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The version agrees everywhere
        # A tag push checks the tag as well. A manual run has no tag to check,
        # so it verifies only that pyproject and the changelog agree — which is
        # all that can be known before a release is named.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/release_check.py --tag "$REF_NAME"
          else
            python scripts/release_check.py
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Fails on a malformed description or metadata, which PyPI would
          # otherwise reject after the version number is already spent.
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
