# Build the Alhazen app's Windows installer, install it on a clean Windows
# machine, and check that the installed app does what it claims.
#
# This is the only place the installer itself is tested: Inno Setup is not a
# development dependency, so a contributor's computer usually cannot compile
# it. The job is the test of four things no unit test covers:
#   * alhazen.iss compiles;
#   * a silent install ends with a working app (its own Python, its packages);
#   * the installed app sets an experiment up using ONLY the uv and git it
#     brought, with neither on PATH (packaging/windows/smoke_test.py);
#   * an uninstall removes the app;
#   * the whole path a user takes, with nothing stood in for: a real Hub
#     server, a real rig, the rig building an experiment's environment with
#     the pinned uv, and a session running in it (the opt-in test in
#     tests/hub/test_live_roundtrip.py).
#
# The installer is kept as an artifact of the run, so a pull request can be
# tried on a real rig before it is merged.
#
# Every `uses:` is pinned to a full commit SHA, the tag it was resolved from
# in the trailing comment: a tag can be moved to other code, a SHA cannot.
name: windows app

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "src/alhazen/cli/app.py"
      - "src/alhazen/hub/environments.py"
      - "pyproject.toml"
      - ".github/workflows/windows-app.yml"
  pull_request:
    # The same list as above, written out: what the installer is made of.
    paths:
      - "packaging/**"
      - "src/alhazen/cli/app.py"
      - "src/alhazen/hub/environments.py"
      - "pyproject.toml"
      - ".github/workflows/windows-app.yml"
  # A manual run builds an installer of whatever ref it is started on.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup's compiler is not at $iscc" }

      - name: Build the installer
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\alhazen_vision-*.whl).FullName
          python packaging\windows\build.py --wheel $wheel --out build\windows
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install it, silently
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build\windows\AlhazenSetup-*.exe).FullName
          $log = Join-Path $PWD "build\windows\setup.log"
          $run = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=$log"
          $home_ = "$env:LOCALAPPDATA\Alhazen"
          # The installer reports success once the files are copied; whether
          # its Python step finished is what installed.ok says.
          if ($run.ExitCode -ne 0 -or -not (Test-Path "$home_\installed.ok")) {
            Write-Host "--- setup.log (end)"; Get-Content $log -Tail 40
            Write-Host "--- install.log"; if (Test-Path "$home_\install.log") { Get-Content "$home_\install.log" }
            throw "The install did not finish (exit code $($run.ExitCode))"
          }
          Get-Content "$home_\install.log" -Tail 5
          Get-ChildItem "$home_\app\Scripts\alhazen*.exe" | ForEach-Object { $_.Name }

      - name: The installed app sets an experiment up and serves its pages
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Alhazen\app\Scripts\python.exe" packaging\windows\smoke_test.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: A real Hub, a real rig, and a session in an environment the rig built
        shell: pwsh
        env:
          ALHAZEN_TEST_REAL_UV: "1"
        run: |
          python -m pip install -e ".[dev]"
          # The same uv the installer ships, so the test and the app agree.
          $env:PATH = "$PWD\build\windows\stage\tools;$env:PATH"
          python -m pytest tests/hub/test_live_roundtrip.py -k "sets_an_experiment_up" -q
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: A second install over the first works (an upgrade)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem build\windows\AlhazenSetup-*.exe).FullName
          $run = Start-Process $setup -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($run.ExitCode -ne 0 -or -not (Test-Path "$env:LOCALAPPDATA\Alhazen\installed.ok")) {
            Get-Content "$env:LOCALAPPDATA\Alhazen\install.log"
            throw "The second install did not finish (exit code $($run.ExitCode))"
          }
          & "$env:LOCALAPPDATA\Alhazen\app\Scripts\alhazen.exe" rigs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Uninstall it
        shell: pwsh
        run: |
          $home_ = "$env:LOCALAPPDATA\Alhazen"
          $run = Start-Process "$home_\unins000.exe" -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          # The uninstaller hands over to a copy of itself and returns; give
          # that copy a moment to finish removing the folder.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$home_\app") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if ($run.ExitCode -ne 0 -or (Test-Path "$home_\app") -or (Test-Path "$home_\tools")) {
            if (Test-Path $home_) { Get-ChildItem $home_ | ForEach-Object { $_.Name } }
            throw "The uninstall left the app behind (exit code $($run.ExitCode))"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AlhazenSetup
          path: build/windows/AlhazenSetup-*.exe
          if-no-files-found: error
