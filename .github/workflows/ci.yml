name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Deliberately no [psychopy] extra: the default suite is hardware- and
      # display-free; display-marked tests run manually on
      # machines with a screen.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=alhazen --cov-report=term-missing
      - name: import layering
        if: runner.os == 'Linux'
        run: lint-imports

  # The dashboard's renderer (src/alhazen/dashboard/assets/dashboard.js) is
  # browser JavaScript that pytest cannot run. tests/js runs it in a fake
  # page with Node's built-in test runner: no npm install, no package.json.
  # Node 22 because it expands the quoted glob itself on every OS.
  dashboard-js:
    name: dashboard renderer / node22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/js/*.test.mjs"
