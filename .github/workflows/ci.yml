name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every `uses:` below is pinned to a full commit SHA, with the tag it was
# resolved from in the trailing comment. A tag is mutable — whoever controls
# the action's repository can move `v4` to different code — and a moved tag
# would run inside this repository's workflows unreviewed. A SHA cannot move.
# To update one, resolve the new tag to its commit and replace both the SHA
# and the comment.

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full OS cross is run on the oldest supported Python (3.10, the
        # requires-python floor) and on 3.12: what differs between operating
        # systems — paths, subprocess spawning, the file system — shows up on
        # either. 3.11 and 3.13 are added on Linux only, because what they can
        # break is the interpreter and the libraries built for it, which does
        # not depend on the OS; crossing them with macOS and Windows as well
        # would add four slow jobs to catch nothing the other six cannot.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Deliberately no [psychopy] extra: the default suite is hardware- and
      # display-free; display-marked tests run manually on
      # machines with a screen.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The coverage floor is [tool.coverage.report] fail_under in
      # pyproject.toml; pytest-cov fails this step when the total is under it.
      - run: pytest --cov=alhazen --cov-report=term-missing
      - name: import layering
        if: runner.os == 'Linux'
        run: lint-imports

  # Every other job installs the newest release of every dependency, so the
  # floors in pyproject.toml (numpy>=1.24, pandas>=2.0, pydantic>=2.5, ...)
  # were promises nothing checked: code could start using a newer API and
  # stay green here while failing for anyone whose environment sat at the
  # floor. This job installs exactly the floors — uv's `lowest-direct` takes
  # the lowest allowed version of each dependency pyproject names directly
  # (their own dependencies still resolve to what those versions accept) —
  # on the oldest supported Python, and runs the suite. Only pytest: the
  # linters' floors say which ruff/mypy the dev extra tolerates, not how
  # alhazen behaves, and the other jobs already run the linters.
  lowest-deps:
    name: ubuntu-latest / py3.10 / lowest direct dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      # uv pinned so a new uv release cannot change what "lowest" resolves to
      # between two runs of the same commit.
      - run: python -m pip install "uv==0.12.18"
      - run: uv pip install --system --resolution lowest-direct -e ".[dev]"
      # Printed so a failure here can be read against the exact versions
      # that were installed, not the ones pyproject.toml merely allows.
      - run: uv pip list --system
      - run: pytest

  # The live monitor's renderer (src/alhazen/live_monitor/assets/live_monitor.js) is
  # browser JavaScript that pytest cannot run. tests/js runs it in a fake
  # page with Node's built-in test runner: no npm install, no package.json.
  # Node 22 because it expands the quoted glob itself on every OS.
  live-monitor-js:
    name: live monitor renderer / node22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test "tests/js/*.test.mjs"
