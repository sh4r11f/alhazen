<!doctype html>
<!--
  Alhazen Experiment Hub: the one page, shared by the central hub (served at /)
  and a rig's loopback dashboard (served at /hub). Static on purpose: no
  templating, no inline script or style, so it runs under the dashboard's
  policy (everything from 'self'). Which host it is on comes from
  GET /api/hub/v1/config (role "server" or "rig"); on a rig the dashboard
  token arrives in the address fragment, as for the workspace.

  Every file it loads is under /hub/assets/ (each host serves a fixed table
  of them): hub.css, hub_docs.css, hub_core.js (pure helpers), hub_docs.js
  (the documentation viewer, its own module), hub.js (views and controller,
  which finds the elements below by id). #main holds one screen at a time,
  each a real address (?view=...; HubCore.parseRoute).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Alhazen Experiment Hub</title>
  <link rel="icon" href="/hub/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/hub/assets/hub.css">
  <link rel="stylesheet" href="/hub/assets/hub_docs.css">
  <script src="/hub/assets/hub_core.js" defer></script>
  <script src="/hub/assets/hub_docs.js" defer></script>
  <script src="/hub/assets/hub.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" id="brand" href="?">
        <img class="brand-mark" src="/hub/assets/icon.svg" alt="" width="28" height="28">
        <span class="brand-word">alhazen</span>
        <span class="brand-sub">Experiment Hub</span>
      </a>
      <p class="role" id="role-badge" aria-live="polite"></p>
      <nav class="primary-nav" id="primary-nav" aria-label="Hub"></nav>
      <div class="account" id="account"></div>
    </div>
  </header>
  <div class="banner" id="banner" role="status" aria-live="polite" hidden></div>
  <main class="main" id="main" tabindex="-1">
    <p class="loading"><span class="spinner" aria-hidden="true"></span>Starting the hub page&hellip;</p>
    <noscript><p class="callout callout-warn">This page needs JavaScript. The rig&rsquo;s own workspace and recorded data do not depend on it.</p></noscript>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-note">Experiments run on rigs, never on the hub. Collected data leaves a rig only when you upload it.</p>
      <p class="footer-links"><a href="?view=guide" id="footer-guide">Guide</a></p>
      <div class="theme" role="group" aria-label="Colour theme">
        <button type="button" class="theme-btn" id="theme-system" aria-pressed="true">Auto</button>
        <button type="button" class="theme-btn" id="theme-light" aria-pressed="false">Light</button>
        <button type="button" class="theme-btn" id="theme-dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </footer>
</body>
</html>
