# MACHINE: the development laptop — a Windows 11 laptop, the machine the
# lab's experiments are written on.
#
# One of alhazen's SHARED rigs (`--rig laptop`), first taken from
# amodal-averaging's configs/rig-laptop.yaml. An experiment that needs
# something different on this machine writes its own configs/rig-laptop.yaml
# beginning `extends: laptop` and says only that (docs/rigs.md).
#
# A rig file describes a machine: its panel, its devices, where its data
# goes. Which of alhazen's six modes you run on it is not the file's business,
# so every mode takes this file as it stands:
#
#   python run.py --mode demo     --rig laptop
#   python run.py --mode simulate --rig laptop --seed 1
#   python run.py --mode test     --rig laptop --sub dev --ses 1
#   python run.py --mode movie    --rig laptop
#
# There is no eye tracker on this laptop, and none is configured below. Test
# mode notices and lets the mouse cursor stand in for gaze; simulate mode
# brings the experiment's scripted participant and needs none. Rehearsal data
# (test, simulate) lands beside data_root under data-rehearsal/, never in it,
# so a simulated subject can never end up in the same table as a real one.

# YOUR HARDWARE, read off this machine (Windows 11) on 2026-09-29:
#
#   screen 1  \\.\DISPLAY1  2560x1440 @ 165 Hz  38 x 21 cm   (the laptop's built-in panel,
#             primary       EDID id BOE09D9, NVIDIA GeForce RTX 3060 Laptop GPU)
#   screen 2  \\.\DISPLAY2  3840x1080 @ 120 Hz  120 x 34 cm  (the Samsung C49HG9x ultrawide)
#
# Windows numbers screens from 1, PsychoPy from 0: the laptop panel, Windows'
# screen 1, is `screen_index: 0` below.
#
# DO NOT USE SCREEN 2 (screen_index 1). The Samsung is off limits for
# experiments; this file targets the laptop panel, and a test pins it
# (tests/unit/test_rigs.py). If a session ever opens on the ultrawide,
# `screen_index` below is what to check.
#
# WINDOWS DISPLAY SCALING. The panel runs at 150 % scaling, so the desktop
# reports it as 1707x960 "logical" pixels. width_px and height_px below are
# the panel's NATIVE 2560x1440, because alhazen places every stimulus in
# PsychoPy's `units="pix"`, which are real framebuffer pixels, and turns them
# into degrees with width_px / width_cm. A process Windows does not consider
# DPI-aware is handed the logical 1707x960 surface, stretched by 1.5 to fill
# the panel, and every stimulus would come out 1.5x too big. Whether
# PsychoPy (through pyglet) declares itself DPI-aware on this machine is NOT
# yet verified here — check it on the first demo. You do not have to trust
# either way: when a fullscreen window opens, alhazen compares the real
# framebuffer with these numbers and refuses to run if they disagree, naming
# both (display/psychopy_backend.py). If it refuses with 1707x960, the fix is
# to make the Python process DPI-aware — one way is the environment's
# python.exe > Properties > Compatibility > Change high DPI settings >
# "Override high DPI scaling behaviour: Application" — never to put 1707 here.
#
# The panel runs at 165 Hz, NOT the lab rig's 120 Hz, so a duration in
# milliseconds is a different number of frames here: one frame is 6.06 ms
# instead of 8.33. alhazen rounds each duration to the nearest whole frame
# at the measured rate, so 200 ms is 33 frames here (exactly 200 ms) and 24
# on the rig, but 100 ms is 16.5 frames and rounds to 16 here (97.0 ms)
# while it is exactly 12 on the rig. A timing read off this machine is not
# the rig's; judge durations on the rig (or `--rig lab-rehearsal`), and cut
# movies against the rig's config. Frame-level timing measured here is not
# the rig's either: this laptop draws through the Windows desktop compositor
# and a GPU that everything else shares, where the rig takes a dedicated
# fullscreen display.
monitor:
  width_px: 2560        # native panel pixels, not the 1707 Windows shows at 150 % scaling
  height_px: 1440
  width_cm: 38.0        # the EDID figure, which EDID rounds to the whole cm — MEASURE the
                        # visible panel with a ruler and put the real width here
  distance_cm: 57.0     # MEASURE THIS — it is what sets a degree of visual angle
  refresh_rate_hz: 165.0
  screen_index: 0       # the laptop panel (Windows' screen 1); index 1 is the Samsung
  fullscreen: true

display:
  backend: psychopy
  # PsychoPy measures the refresh rate by looking for 10 consecutive IDENTICAL
  # frame intervals, and alhazen gives it `warmup_flips` frames to find them
  # in. The default 30 leaves only 20 after warm-up, which a desktop drawn
  # through a compositor (Windows' DWM here, with display scaling on and a
  # laptop GPU shared with the browser) will not reliably produce — the
  # session then refuses to start, correctly, because it cannot verify the
  # timing. More frames to search gives it room: 240 flips is about 1.5 s at
  # 165 Hz. The rig takes a dedicated fullscreen display and does not need
  # this.
  warmup_flips: 240
  frame_qa:
    # Count drops on every trial record, so the analysis's frame-timing report
    # has numbers to show on a machine that is also running a browser.
    #
    # Deliberately NOT recycle_trial, which is what the rig uses. A laptop
    # sharing its GPU with everything else drops frames as a matter of course,
    # and recycling on that would re-serve trials faster than it retired them
    # — a rehearsal that never ends. Here a drop is information, not a fault.
    policy: mark_trial
    # No threshold: mark_trial reads none (it counts every trial's
    # drops on the record), and alhazen refuses one it would ignore.

live_monitor:
  # alhazen's live monitoring UI. It opens in a browser BEFORE PsychoPy takes
  # focus, and stays read-only until you pause the session with P, so nothing
  # you click can reach a running trial. Demo mode runs no trials and leaves
  # it closed.
  enabled: true
  auto_open: true
  port: 0

# No devices: a laptop has none. Test mode substitutes the mouse for the
# missing tracker and says so before trial one.
devices: {}

data_root: data

# A DEVELOPMENT RIG: no real data is collected on this machine. Every
# experiment's run.py starts here when a command names no --rig, and run
# mode drives a rig exactly as written, so a forgotten --rig used to record a
# "real" session with no tracker into data/ — junk, filed where the analysis
# looks for subjects. Run mode now refuses this rig before anything is
# written, and says which rigs to name instead; every other mode runs here as
# before. To collect real data on this laptop ON PURPOSE (a keyboard pilot),
# the experiment writes its own configs/rig-laptop.yaml with `extends: laptop`
# and `real_data: true`, which is version-controlled and copied into every run
# it records (docs/rigs.md §5).
real_data: false
