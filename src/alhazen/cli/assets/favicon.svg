  <!-- The Alhazen mark for the browser tab. An image cannot read the page's
       tokens, so its colours are explicit: the light theme's ink and accent,
       and the dark theme's under prefers-color-scheme. -->
  <style>
    .mark-ink { fill: #1f1b17; }
    .mark-face { fill: #7f1d1d; }
    @media (prefers-color-scheme: dark) {
      .mark-ink { fill: #ece6da; }
      .mark-face { fill: #d8706a; }
    }
  </style>
