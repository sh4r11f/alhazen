<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- The alhazen workspace's favicon: the sidebar logo (workspace.html),
       standalone. An A painted in the Ouchi illusion: bold 4:1 bricks laid
       horizontally, and inside the letter the same bricks turned 90 degrees
       and shifted, so the A is seen only through the change of orientation.
       An image cannot read the page's CSS, so its colours are here, light
       and dark by the system's setting; they are the same as the page's
       logo-ground and logo-brick tokens (workspace.css). -->
  <style>
    .logo-ground { fill: #ffffff; }
    .logo-brick { fill: #27313d; }
    @media (prefers-color-scheme: dark) {
      .logo-ground { fill: #080808; }
      .logo-brick { fill: #b2b2b1; }
    }
  </style>
  <defs>
  <!-- The bricks, 4:1. Here 7 units wide, not the sidebar's 4: at a browser
       tab's 16-32 px the finer bricks blur into grey and the A is lost.
       The ground: one tile of two 28×7 bricks, the second offset by
       half a tile, so tiles repeat into a checkerboard of horizontal bricks. -->
  <pattern id="logo-bricks" width="56" height="14" patternUnits="userSpaceOnUse">
    <rect class="logo-brick" width="28" height="7"/>
    <rect class="logo-brick" x="28" y="7" width="28" height="7"/>
  </pattern>
  <!-- The figure: the same bricks turned upright (7×28) and shifted
       by half a brick width both ways, so no edge inside the A lines up
       with an edge of the ground's; that mismatch is what makes the letter
       seem to float. -->
  <pattern id="logo-bricks-turned" width="14" height="56"
           patternUnits="userSpaceOnUse" patternTransform="translate(3.5 3.5)">
    <rect class="logo-brick" width="7" height="28"/>
    <rect class="logo-brick" x="7" y="28" width="7" height="28"/>
  </pattern>
  <!-- LOGO-START: the same in workspace.html and favicon.svg (a test
       compares them; only the brick size above differs). -->
  <clipPath id="logo-frame"><rect width="56" height="56" rx="8"/></clipPath>
  <!-- The A: the outline of Nunito's capital A at weight 800 (the page's
       own font, fonts/), taken with fontTools and scaled to 50.4 of the
       icon's 56 units wide, baseline at 52.5. A path, not text, so it is
       the same in every browser and in the favicon, which cannot load the
       page's font. Its second subpath is the triangular counter, wound the
       other way, so the nonzero rule leaves it open. -->
  <clipPath id="logo-letter">
    <path d="M7.63 52.5Q5.66 52.5 4.41 51.59Q3.16 50.67 2.87 49.12Q2.58 47.56 3.45 45.62L21.66 5.85Q22.76 3.43 24.34 2.36Q25.91 1.28 27.97 1.28Q29.98 1.28 31.55 2.36Q33.11 3.43 34.21 5.85L52.47 45.62Q53.41 47.58 53.14 49.16Q52.87 50.74 51.67 51.62Q50.46 52.5 48.57 52.5Q46.18 52.5 44.87 51.38Q43.56 50.25 42.53 47.84L38.3 38L42.71 41.04H13.12L17.52 38L13.34 47.84Q12.26 50.3 11.09 51.4Q9.92 52.5 7.63 52.5ZM27.83 13.59 18.75 35.25 16.81 32.43H39.01L37.13 35.25L27.97 13.59Z"/>
  </clipPath>
</defs>
<g clip-path="url(#logo-frame)">
    <rect class="logo-ground" width="56" height="56"/>
    <rect width="56" height="56" fill="url(#logo-bricks)"/>
    <!-- Inside the A: the ground colour over the horizontal bricks, then
         the upright ones. No outline, halo or solid fill: the letter is
         only the change of brick orientation. -->
    <g clip-path="url(#logo-letter)">
      <rect class="logo-ground" width="56" height="56"/>
      <rect width="56" height="56" fill="url(#logo-bricks-turned)"/>
    </g>
  </g>
  <!-- LOGO-END -->
</svg>
