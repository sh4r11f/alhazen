<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The alhazen workspace's favicon: the sidebar logo (workspace.html),
       standalone. An A painted in the Ouchi illusion: bold 4:1 bricks laid
       horizontally, and inside the letter the same bricks turned 90 degrees
       and shifted, so the A is seen only through the change of orientation.
       An image cannot read the page's CSS, so its colours are here, light
       and dark by the system's setting; they are the same as the page's
       logo-ground and logo-brick tokens (workspace.css). -->
  <style>
    .logo-ground { fill: #ffffff; }
    .logo-brick { fill: #27313d; }
    @media (prefers-color-scheme: dark) {
      .logo-ground { fill: #080808; }
      .logo-brick { fill: #b2b2b1; }
    }
  </style>
  <defs>
  <!-- LOGO-START: the same in workspace.html and favicon.svg (a test
       compares them). The ground: one tile of two 16×4 bricks (4:1), the
       second offset by half a tile, so tiles repeat into a checkerboard of
       bold horizontal bricks, five dark rows across the icon. -->
  <pattern id="logo-bricks" width="32" height="8" patternUnits="userSpaceOnUse">
    <rect class="logo-brick" width="16" height="4"/>
    <rect class="logo-brick" x="16" y="4" width="16" height="4"/>
  </pattern>
  <!-- The figure: the same bricks turned upright (4×16) and shifted by
       half a brick width both ways (2, 2), so no edge inside the A lines
       up with an edge of the ground's; that mismatch is what makes the
       letter seem to float. -->
  <pattern id="logo-bricks-turned" width="8" height="32"
           patternUnits="userSpaceOnUse" patternTransform="translate(2 2)">
    <rect class="logo-brick" width="4" height="16"/>
    <rect class="logo-brick" x="4" y="16" width="4" height="16"/>
  </pattern>
  <clipPath id="logo-frame"><rect width="40" height="40" rx="9"/></clipPath>
  <!-- The A, drawn as a path (not text) so it is the same in every
       browser and in the favicon, which cannot load the page's font.
       The first subpath is the letter's outline: feet at x 1-11 and
       29-39 on the baseline (y 37), a flat apex 7 wide at the top (y 3),
       legs 10 wide (two and a half bricks) and the crossbar's underside
       at y 32. The second is the counter (the triangle above the
       crossbar, y 17.3-26), cut out by the evenodd rule. -->
  <clipPath id="logo-letter">
    <path clip-rule="evenodd"
          d="M1 37L16.5 3H23.5L39 37H29L26.72 32H13.28L11 37ZM16.01 26L20 17.26L23.99 26Z"/>
  </clipPath>
</defs>
<g clip-path="url(#logo-frame)">
    <rect class="logo-ground" width="40" height="40"/>
    <rect width="40" height="40" fill="url(#logo-bricks)"/>
    <!-- Inside the A: the ground colour over the horizontal bricks, then
         the upright ones. No outline, halo or solid fill: the letter is
         only the change of brick orientation. -->
    <g clip-path="url(#logo-letter)">
      <rect class="logo-ground" width="40" height="40"/>
      <rect width="40" height="40" fill="url(#logo-bricks-turned)"/>
    </g>
  </g>
  <!-- LOGO-END -->
</svg>
