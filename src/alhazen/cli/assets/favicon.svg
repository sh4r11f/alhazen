<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The alhazen workspace's favicon: the sidebar logo (workspace.html),
       standalone. A capital A over the Ouchi illusion: bold 4:1 bricks laid
       one way, and a disc of the same bricks turned 90 degrees and shifted,
       which seems to float. An image cannot read the page's CSS, so its
       colours are here, light and dark by the system's setting. -->
  <style>
    .logo-ground { fill: #ffffff; }
    .logo-brick { fill: #27313d; }
    .logo-letter {
      fill: #3563d6; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round;
      paint-order: stroke; font: 1000 23px/1 Nunito, "Segoe UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      .logo-ground { fill: #171e27; }
      .logo-brick { fill: #c9d3df; }
      .logo-letter { fill: #8aabf8; stroke: #171e27; }
    }
  </style>
  <defs>
  <!-- LOGO-START: the same in workspace.html and favicon.svg (a test
       compares them). One tile: two 16×4 bricks (4:1), the second
       offset by half a tile, so tiles repeat into a checkerboard of
       bold bricks, five dark rows across the icon. -->
  <pattern id="logo-bricks" width="32" height="8" patternUnits="userSpaceOnUse">
    <rect class="logo-brick" width="16" height="4"/>
    <rect class="logo-brick" x="16" y="4" width="16" height="4"/>
  </pattern>
  <!-- The same bricks turned upright (4×16) and shifted by half a
       brick, so no edge inside the disc lines up with the ground's:
       that mismatch is what makes the disc seem to float. -->
  <pattern id="logo-bricks-turned" width="8" height="32"
           patternUnits="userSpaceOnUse" patternTransform="translate(2 8)">
    <rect class="logo-brick" width="4" height="16"/>
    <rect class="logo-brick" x="4" y="16" width="4" height="16"/>
  </pattern>
  <clipPath id="logo-frame"><rect width="40" height="40" rx="9"/></clipPath>
</defs>
<g clip-path="url(#logo-frame)">
  <rect class="logo-ground" width="40" height="40"/>
  <rect width="40" height="40" fill="url(#logo-bricks)"/>
  <circle class="logo-ground" cx="20" cy="20" r="16"/>
  <circle cx="20" cy="20" r="16" fill="url(#logo-bricks-turned)"/>
  <!-- The A: a solid letter with a halo in the ground colour drawn
       under it (paint-order), so it reads over the bricks. -->
  <text class="logo-letter" x="20" y="28.5" text-anchor="middle">A</text>
</g>
<!-- LOGO-END -->
</svg>
