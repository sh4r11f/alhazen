<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alhazen live monitor</title>
<style>__STYLE__</style>
</head>
<body>
<header>
  <div>
    <div class="brand">Alhazen</div>
    <div id="identity">Connecting…</div>
  </div>
  <div class="right">
    <span id="counts"></span>
    <span id="status" data-state="starting">starting</span>
  </div>
</header>

<div class="shell">
  <!-- The sidebar scopes what is shown and carries the session controls.
       The buttons are drawn by live_monitor.js (renderControls) into every
       [data-controls-host] on the page, this one included, from the
       session's own list of what it will act on; the server holds every
       click to the same list, so the buttons are a view, not the boundary. -->
  <nav class="sidebar">
    <h2 class="side-title">Panels</h2>
    <ul id="sections" class="sections"></ul>

    <h2 class="side-title">Session</h2>
    <div id="controls" class="controls" data-controls-host></div>
    <p id="notice"></p>

    <!-- The two streams the operator can switch off on a slow machine
         (live_monitor.js, "Live streams"). Off stops the session producing
         the stream, not only the page drawing it. The live page only. -->
    <h2 id="streams-title" class="side-title streams-title">Live streams</h2>
    <div id="streams" class="streams">
      <button id="stream-gaze_traces" class="stream-switch" type="button" role="switch" aria-checked="true" data-stream="gaze_traces">
        <span class="switch-label">Gaze traces</span><span class="switch-track" aria-hidden="true"></span>
      </button>
      <button id="stream-camera" class="stream-switch" type="button" role="switch" aria-checked="true" data-stream="camera">
        <span class="switch-label">Eye camera</span><span class="switch-track" aria-hidden="true"></span>
      </button>
      <p id="streams-note" class="streams-note"></p>
    </div>

    <h2 class="side-title">View</h2>
    <div class="controls">
      <button class="control" id="theme" type="button">Theme: auto</button>
    </div>
  </nav>

  <main>
    <!-- Procedure guide: the eye-tracker procedure the operator is in
         (calibration, validation, drift correction), drawn from the
         session's state.procedure by live_monitor.js ("Procedure guide").
         The subject's screen shows nothing but targets meanwhile, so this is
         where the operator reads what to do; first in the page, so a
         one-screen rig sees it without scrolling. -->
    <section id="procedure" class="procedure" aria-live="polite" hidden>
      <div class="procedure-head">
        <h2 id="procedure-heading"></h2>
        <span id="procedure-step" class="procedure-step"></span>
      </div>
      <ol id="procedure-track" class="procedure-track" aria-hidden="true"></ol>
      <p id="procedure-instruction" class="procedure-instruction"></p>
      <p id="procedure-status" class="procedure-status"></p>
      <div id="procedure-failure" class="procedure-failure" hidden>
        <p id="procedure-failure-text" class="procedure-failure-text"></p>
        <p id="procedure-check" class="procedure-check"></p>
      </div>
    </section>
    <!-- Trial view: the running trial's screen in degrees, with the eye's
         position over it (live_monitor.js, "Trial view"). The live page only;
         the copy saved in figures/ has no trial running. -->
    <section id="trial-view" class="trial-view" hidden>
      <div class="trial-head">
        <h2 id="trial-title">Trial</h2>
        <span id="trial-meta"></span>
        <label class="trial-trail">Trail
          <select id="trial-trail">
            <option value="0.5">0.5 s</option>
            <option value="1">1 s</option>
            <option value="2">2 s</option>
            <option value="0">Whole trial</option>
          </select>
        </label>
      </div>
      <div class="trial-body">
        <figure class="trial-stage">
          <div id="trial-stage" class="trial-stage-box"></div>
          <div id="trial-legend" class="legend"></div>
          <figcaption id="trial-status"></figcaption>
          <p id="trial-note" class="note"></p>
        </figure>
        <figure class="trial-camera">
          <div id="trial-camera" class="trial-camera-box"></div>
          <figcaption id="trial-camera-note"></figcaption>
        </figure>
      </div>
      <!-- The task's controls (resume, pause, calibrate, …) are rendered here
           by the operator-command block, the same buttons as the sidebar's. -->
      <div id="trial-controls" class="trial-controls" data-controls-host></div>
    </section>
    <div id="grid" class="grid"></div>
  </main>
</div>

<!-- The saved copy in figures/ has its snapshot baked in here; the live page
     gets `null` and polls the server instead. -->
<script>const STATIC_STATE = __STATIC_STATE__;</script>
<script>__SCRIPT__</script>
</body>
</html>
