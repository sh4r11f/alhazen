<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alhazen live monitor</title>
<style>__STYLE__</style>
</head>
<body>
<header>
  <div>
    <div class="brand">Alhazen</div>
    <div id="identity">Connecting…</div>
  </div>
  <div class="right">
    <span id="counts"></span>
    <span id="status" data-state="starting">starting</span>
  </div>
</header>

<div class="shell">
  <!-- The sidebar scopes what is shown and carries the session controls. The
       buttons are inert while the session is running: the server refuses a
       command unless its own state says paused, so this is a courtesy, not
       the boundary. -->
  <nav class="sidebar">
    <h2 class="side-title">Panels</h2>
    <ul id="sections" class="sections"></ul>

    <h2 class="side-title">Session</h2>
    <div class="controls">
      <button class="control" data-command="resume">Resume</button>
      <!-- The three eye-tracker procedures, in the order the pause menu
           lists them (C, V, D). Their results land in the "Eye tracker"
           section of the panels. -->
      <button class="control" data-command="calibrate">Calibrate</button>
      <button class="control" data-command="validate">Validate</button>
      <button class="control" data-command="drift_correct">Drift correct</button>
      <button class="control" data-command="manual_reward">Give reward</button>
      <button class="control" data-command="promote_stage">Promote stage</button>
      <button class="control" data-command="demote_stage">Demote stage</button>
      <button class="control" data-command="hold_stage">Hold stage</button>
      <button class="control danger" data-command="quit">Quit</button>
    </div>
    <p id="notice">Press P on the experimenter keyboard to pause.</p>

    <h2 class="side-title">View</h2>
    <div class="controls">
      <button class="control" id="theme" type="button">Theme: auto</button>
    </div>
  </nav>

  <main>
    <!-- Trial view: the running trial's screen in degrees, with the eye's
         position over it (live_monitor.js, "Trial view"). The live page only;
         the copy saved in figures/ has no trial running. -->
    <section id="trial-view" class="trial-view" hidden>
      <div class="trial-head">
        <h2 id="trial-title">Trial</h2>
        <span id="trial-meta"></span>
        <label class="trial-trail">Trail
          <select id="trial-trail">
            <option value="0.5">0.5 s</option>
            <option value="1">1 s</option>
            <option value="2">2 s</option>
            <option value="0">Whole trial</option>
          </select>
        </label>
      </div>
      <div class="trial-body">
        <figure class="trial-stage">
          <div id="trial-stage" class="trial-stage-box"></div>
          <div id="trial-legend" class="legend"></div>
          <figcaption id="trial-status"></figcaption>
          <p id="trial-undrawn" class="note"></p>
        </figure>
        <figure class="trial-camera">
          <div id="trial-camera" class="trial-camera-box"></div>
          <figcaption id="trial-camera-note"></figcaption>
        </figure>
      </div>
      <!-- The task's controls (resume, pause, calibrate, …) are rendered here
           by the operator-command block, the same buttons as the sidebar's. -->
      <div class="trial-controls" data-controls-host></div>
    </section>
    <div id="grid" class="grid"></div>
  </main>
</div>

<!-- The saved copy in figures/ has its snapshot baked in here; the live page
     gets `null` and polls the server instead. -->
<script>const STATIC_STATE = __STATIC_STATE__;</script>
<script>__SCRIPT__</script>
</body>
</html>
