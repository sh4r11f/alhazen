site_name: alhazen
site_description: A framework for building and running vision science experiments
repo_url: https://github.com/sh4r11f/alhazen
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: light mode}

plugins:
  - search
  # API pages are generated from the docstrings, so the reference cannot
  # drift from the code the way a hand-written one does.
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            docstring_style: google
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: architecture.md
  - How-to:
      - Add a stimulus, phase or paradigm: how-to.md
  - Scenes: scenes.md
  - Experiment database: database.md
  - Live dashboard: dashboard.md
  - Versioning and releases: versioning.md
  - API reference: reference.md
